<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Розклад ававава</title>

<style>

:root {
    --bg: #030303;
    --bg2: #090507;

    --card: rgba(12,5,8,.84);
    --card2: rgba(20,7,11,.96);

    --text: #f5eeee;
    --muted: #9d8589;

    --blue: #b50928;
    --cyan: #ff294d;
    --purple: #650014;
    --pink: #ff1744;
    --green: #e0002a;
    --yellow: #ff687e;
    --red: #d60029;

    --border: rgba(255,35,65,.13);

    --shadow:
        0 20px 70px rgba(0,0,0,.75),
        inset 0 1px 0 rgba(255,255,255,.025);

    --radius: 24px;
    --ease: cubic-bezier(.2,.8,.2,1);
}

body.light {
    --bg: #edf3ff;
    --bg2: #f8fbff;

    --card: rgba(255,255,255,.72);
    --card2: rgba(255,255,255,.94);

    --text: #18213b;
    --muted: #64708e;

    --border: rgba(20,40,90,.12);

    --shadow:
        0 20px 50px rgba(48,75,130,.16),
        inset 0 1px 0 rgba(255,255,255,.85);
}

body.blueTheme {
    --blue: #087cff;
    --cyan: #00d9ff;
    --purple: #315cff;
    --pink: #007aff;
    --green: #00e0a4;
}

body.purpleTheme {
    --blue: #8b5cf6;
    --cyan: #c084fc;
    --purple: #a855f7;
    --pink: #ec4899;
    --green: #34d399;
}

body.greenTheme {
    --blue: #00b894;
    --cyan: #00f5a0;
    --purple: #00cec9;
    --pink: #55efc4;
    --green: #00ffb3;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(180,0,30,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(100,0,20,.18),
            transparent 34%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,0,35,.08),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            var(--bg),
            var(--bg2)
        );

    transition:
        background .7s ease,
        color .5s ease;

    overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -20;
}

.background::before {
    content: "";
    position: absolute;
    inset: -20%;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(160,0,25,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 35%,
            rgba(100,0,15,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,0,35,.10),
            transparent 35%
        );

    filter: blur(20px);

    animation:
        ghoulAtmosphere 12s ease-in-out infinite alternate;
}

@keyframes ghoulAtmosphere {
    0% {
        transform: scale(1) translate(0,0);
    }

    100% {
        transform: scale(1.15) translate(-30px,20px);
    }
}

/* =========================================================
   GRID
========================================================= */

.grid {
    position: absolute;
    inset: -50%;

    background-image:
        linear-gradient(
            rgba(100,130,255,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(100,130,255,.045) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    transform:
        perspective(700px)
        rotateX(62deg)
        translateY(-120px);

    animation:
        gridMove 20s linear infinite;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 25%,
            black 75%,
            transparent
        );
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 55px;
    }
}

/* =========================================================
   ORBS
========================================================= */

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .42;

    animation:
        orbFloat 12s ease-in-out infinite alternate;
}

.orb1 {
    width: 460px;
    height: 460px;
    left: -150px;
    top: 0;
    background: var(--blue);
}

.orb2 {
    width: 390px;
    height: 390px;
    right: -130px;
    top: 25%;
    background: var(--purple);
    animation-delay: -4s;
}

.orb3 {
    width: 320px;
    height: 320px;
    left: 35%;
    bottom: -160px;
    background: var(--cyan);
    animation-delay: -8s;
}

@keyframes orbFloat {
    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(90px,-60px,0)
            scale(1.2);
    }
}

/* =========================================================
   AURORA
========================================================= */

.aurora {
    position: absolute;

    width: 900px;
    height: 350px;

    left: 50%;
    top: 20%;

    transform:
        translateX(-50%)
        rotate(-8deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(181,9,40,.16),
            rgba(101,0,20,.18),
            transparent
        );

    filter: blur(50px);
    opacity: .35;

    animation:
        auroraMove 10s ease-in-out infinite alternate;
}

@keyframes auroraMove {
    from {
        transform:
            translateX(-50%)
            translateY(0)
            rotate(-8deg)
            scaleX(1);
    }

    to {
        transform:
            translateX(-50%)
            translateY(80px)
            rotate(8deg)
            scaleX(1.25);
    }
}

/* =========================================================
   BLOOD FOG
========================================================= */

.bloodFog {
    position: absolute;

    width: 700px;
    height: 700px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(180,0,30,.18),
            rgba(100,0,20,.08) 35%,
            transparent 70%
        );

    filter: blur(70px);
    opacity: .7;

    animation:
        bloodFogMove 16s ease-in-out infinite alternate;
}

.bloodFog.fog1 {
    left: -250px;
    top: 10%;
}

.bloodFog.fog2 {
    right: -250px;
    bottom: 0;
    animation-delay: -7s;
}

@keyframes bloodFogMove {
    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(100px,-70px)
            scale(1.3);
    }
}

/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            1px 1px at 10% 20%,
            rgba(255,255,255,.8),
            transparent
        ),
        radial-gradient(
            1px 1px at 30% 70%,
            rgba(255,255,255,.65),
            transparent
        ),
        radial-gradient(
            1px 1px at 70% 30%,
            rgba(255,255,255,.8),
            transparent
        ),
        radial-gradient(
            1px 1px at 90% 80%,
            rgba(255,255,255,.55),
            transparent
        );

    background-size:
        300px 300px,
        420px 420px,
        520px 520px,
        650px 650px;

    animation:
        particlesMove 25s linear infinite;
}

@keyframes particlesMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-220px);
    }
}

/* =========================================================
   METEORS
========================================================= */

.meteor {
    position: absolute;

    width: 150px;
    height: 2px;

    border-radius: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            #8f001c,
            #ff294d
        );

    box-shadow:
        0 0 12px #ff173d,
        0 0 25px #8f001c;

    transform: rotate(-35deg);

    opacity: 0;

    animation:
        meteor 8s linear infinite;
}

.meteor:nth-child(5) {
    left: 10%;
    top: 8%;
}

.meteor:nth-child(6) {
    left: 65%;
    top: 12%;
    animation-delay: 3s;
}

.meteor:nth-child(7) {
    left: 40%;
    top: 45%;
    animation-delay: 6s;
}

@keyframes meteor {
    0% {
        transform:
            translate(0,0)
            rotate(-35deg);
        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    30% {
        transform:
            translate(700px,450px)
            rotate(-35deg);
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   RINGS
========================================================= */

.ring {
    position: absolute;

    border:
        1px solid
        rgba(90,130,255,.12);

    border-radius: 50%;

    animation:
        ringFloat 15s linear infinite;
}

.ring1 {
    width: 500px;
    height: 500px;
    left: -250px;
    top: 45%;
}

.ring2 {
    width: 350px;
    height: 350px;
    right: -150px;
    bottom: 5%;
    animation-duration: 20s;
}

@keyframes ringFloat {
    from {
        transform:
            rotate(0deg)
            scale(1);
    }

    to {
        transform:
            rotate(360deg)
            scale(1.08);
    }
}

/* =========================================================
   PETALS
========================================================= */

.petals {
    position: fixed;
    inset: 0;

    pointer-events: none;
    overflow: hidden;

    z-index: 1;
}

.petal {
    position: absolute;
    top: -80px;

    width: 18px;
    height: 28px;

    background:
        radial-gradient(
            ellipse at 35% 30%,
            #ff526c 0%,
            #c90028 35%,
            #65000f 75%,
            #240006 100%
        );

    border-radius:
        70% 20% 70% 20%;

    opacity: .78;

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,0,40,.55)
        );

    animation:
        petalFall linear infinite;
}

.petal:nth-child(1) {
    left: 4%;
    animation-duration: 9s;
    animation-delay: -2s;
}

.petal:nth-child(2) {
    left: 12%;
    animation-duration: 13s;
    animation-delay: -8s;
}

.petal:nth-child(3) {
    left: 21%;
    animation-duration: 10s;
    animation-delay: -5s;
}

.petal:nth-child(4) {
    left: 31%;
    animation-duration: 15s;
    animation-delay: -11s;
}

.petal:nth-child(5) {
    left: 42%;
    animation-duration: 11s;
    animation-delay: -4s;
}

.petal:nth-child(6) {
    left: 53%;
    animation-duration: 14s;
    animation-delay: -9s;
}

.petal:nth-child(7) {
    left: 64%;
    animation-duration: 10s;
    animation-delay: -1s;
}

.petal:nth-child(8) {
    left: 74%;
    animation-duration: 16s;
    animation-delay: -7s;
}

.petal:nth-child(9) {
    left: 84%;
    animation-duration: 12s;
    animation-delay: -3s;
}

.petal:nth-child(10) {
    left: 94%;
    animation-duration: 14s;
    animation-delay: -12s;
}

@keyframes petalFall {
    0% {
        transform:
            translate3d(0,-80px,0)
            rotate(0deg)
            scale(.8);
        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    30% {
        transform:
            translate3d(80px,30vh,0)
            rotate(160deg)
            scale(1);
    }

    55% {
        transform:
            translate3d(-70px,60vh,0)
            rotate(320deg)
            scale(.8);
    }

    80% {
        transform:
            translate3d(100px,85vh,0)
            rotate(500deg)
            scale(.95);
    }

    100% {
        transform:
            translate3d(-30px,115vh,0)
            rotate(700deg)
            scale(.7);
        opacity: 0;
    }
}

/* =========================================================
   KANEKI
========================================================= */

.kaneki-bg {
    position: fixed;
    right: -80px;
    top: 50%;

    width: 500px;
    height: 720px;

    transform:
        translateY(-50%);

    z-index: -5;

    pointer-events: none;

    opacity: .18;

    filter:
        drop-shadow(
            0 0 35px
            rgba(255,0,40,.25)
        );
}

.kaneki-hair {
    position: absolute;

    width: 260px;
    height: 320px;

    right: 100px;
    top: 60px;

    background:
        radial-gradient(
            ellipse at 50% 40%,
            #f3f3f3,
            #aaa 45%,
            #333 75%,
            #080808 100%
        );

    border-radius:
        48% 52% 35% 40%;

    transform:
        rotate(-8deg);

    box-shadow:
        -40px 20px 0 -15px #111,
        35px 40px 0 -20px #222;
}

.kaneki-head {
    position: absolute;

    width: 235px;
    height: 280px;

    right: 115px;
    top: 100px;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #888
        );

    border-radius:
        48% 48% 44% 44%;

    box-shadow:
        inset -30px -10px 50px rgba(0,0,0,.6);
}

.kaneki-eye {
    position: absolute;

    width: 35px;
    height: 25px;

    right: 42px;
    top: 110px;

    background: #ff1744;

    border-radius: 50%;

    box-shadow:
        0 0 15px #ff1744,
        0 0 35px #d60029;
}

.kaneki-mask {
    position: absolute;

    width: 150px;
    height: 85px;

    right: 30px;
    bottom: 20px;

    background:
        linear-gradient(
            135deg,
            #151515,
            #050505
        );

    border-radius:
        30% 40% 45% 30%;

    box-shadow:
        inset 0 0 20px rgba(255,0,30,.2);
}

.kaneki-neck {
    position: absolute;

    width: 120px;
    height: 130px;

    right: 170px;
    top: 330px;

    background:
        linear-gradient(
            90deg,
            #222,
            #777,
            #222
        );
}

.kaneki-body {
    position: absolute;

    width: 340px;
    height: 300px;

    right: 20px;
    top: 420px;

    background:
        linear-gradient(
            135deg,
            #151515,
            #050505
        );

    border-radius:
        50% 50% 15% 15%;

    box-shadow:
        inset 0 0 70px rgba(255,0,30,.12);
}

.kaneki-red-aura {
    position: absolute;

    width: 500px;
    height: 500px;

    right: -50px;
    top: 100px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,35,.20),
            transparent 65%
        );

    filter: blur(40px);

    animation:
        kanekiAura 5s ease-in-out infinite alternate;
}

@keyframes kanekiAura {
    from {
        transform: scale(.9);
        opacity: .5;
    }

    to {
        transform: scale(1.15);
        opacity: .9;
    }
}

/* =========================================================
   MOUSE GLOW
========================================================= */

#mouseGlow {
    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255,0,40,.10),
            transparent 70%
        );

    transform:
        translate(-50%,-50%);

    z-index: -1;

    transition:
        left .12s ease-out,
        top .12s ease-out;
}

/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: min(1500px,94%);
    margin: auto;

    position: relative;
    z-index: 2;
}

/* =========================================================
   HEADER
========================================================= */

header {
    padding: 32px 0 20px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

/* =========================================================
   LOGO
========================================================= */

.logo {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logoIcon {
    width: 60px;
    height: 60px;

    border-radius: 19px;

    display: grid;
    place-items: center;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #d0002f,
            #41000d
        );

    box-shadow:
        0 0 35px
        rgba(210,0,40,.45);

    animation:
        logoPulse 4s ease-in-out infinite;
}

@keyframes logoPulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

.logo h1 {
    font-size:
        clamp(22px,3vw,34px);

    letter-spacing: -.8px;
}

.logo p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.control {
    height: 44px;
    padding: 0 15px;

    border-radius: 14px;

    border:
        1px solid
        var(--border);

    background:
        var(--card);

    color:
        var(--text);

    backdrop-filter:
        blur(18px);

    cursor:
        pointer;

    transition:
        .3s ease;
}

.control:hover {
    border-color: var(--blue);

    box-shadow:
        0 0 25px
        rgba(255,0,40,.2);
}

/* =========================================================
   THEME MENU
========================================================= */

.themeMenu {
    position: relative;
}

.themeOptions {
    position: absolute;

    right: 0;
    top: 52px;

    width: 190px;

    padding: 8px;

    border-radius: 18px;

    background:
        var(--card2);

    border:
        1px solid
        var(--border);

    backdrop-filter:
        blur(25px);

    box-shadow:
        var(--shadow);

    opacity: 0;

    transform:
        translateY(-10px)
        scale(.96);

    pointer-events: none;

    transition:
        .3s var(--ease);

    z-index: 50;
}

.themeMenu.open .themeOptions {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

.themeOption {
    width: 100%;

    padding: 11px;

    border: 0;

    border-radius: 12px;

    background: transparent;

    color: var(--text);

    text-align: left;

    cursor: pointer;

    transition:
        background .25s ease;
}

.themeOption:hover {
    background:
        rgba(100,120,255,.12);
}

/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    padding: 34px;

    border-radius: 30px;

    border:
        1px solid
        var(--border);

    background:
        linear-gradient(
            135deg,
            rgba(60,100,255,.12),
            rgba(160,70,255,.08)
        ),
        var(--card);

    backdrop-filter:
        blur(25px);

    box-shadow:
        var(--shadow);

    overflow: hidden;

    margin-bottom: 24px;
}

.hero::before {
    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    right: -160px;
    top: -190px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,30,70,.18),
            transparent 70%
        );

    animation:
        heroGlow 7s ease-in-out infinite alternate;
}

@keyframes heroGlow {
    to {
        transform:
            scale(1.35)
            translate(-20px,20px);
    }
}

.hero::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 1px;

    left: 0;
    top: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            var(--purple),
            transparent
        );

    opacity: .5;

    animation:
        heroLine 5s linear infinite;
}

@keyframes heroLine {
    0% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(100%);
    }
}

.heroContent {
    position: relative;
    z-index: 2;
}

.heroTop {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.heroTitle {
    font-size:
        clamp(30px,5vw,58px);

    font-weight: 800;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            var(--text),
            var(--blue),
            var(--purple)
        );

    -webkit-background-clip: text;

    color: transparent;

    background-size: 200% 100%;

    animation:
        titleGradient 5s ease infinite;
}

@keyframes titleGradient {
    0%,100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }
}

.weekBadge {
    padding: 11px 17px;

    border-radius: 100px;

    background:
        rgba(255,0,40,.08);

    border:
        1px solid
        rgba(255,0,40,.25);

    color: var(--blue);

    font-weight: 700;

    white-space: nowrap;
}

/* =========================================================
   STATS
========================================================= */

.heroGrid {
    margin-top: 26px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 14px;
}

.stat {
    padding: 17px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        var(--border);

    transition: .3s ease;
}

.stat:hover {
    border-color:
        rgba(255,0,40,.3);

    background:
        rgba(255,255,255,.04);
}

.statLabel {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 7px;
}

.statValue {
    font-size: 20px;
    font-weight: 750;
}

/* =========================================================
   PROGRESS
========================================================= */

.progressArea {
    display: grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap: 16px;

    margin-top: 22px;
}

.progressBox {
    position: relative;

    padding: 18px 20px;

    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(20px);

/* =========================================================
   DAYS
========================================================= */

const days = [
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П’ятниця"
];

const jsDays = [
    "Неділя",
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П’ятниця",
    "Субота"
];

let selectedDay = "all";
let searchText = "";
let lastMinute = "";
let lastWeek = null;


/* =========================================================
   ACADEMIC WEEK
========================================================= */

function getAcademicWeek(date = new Date()) {

    const start =
        new Date(SEMESTER_START);

    start.setHours(0,0,0,0);

    const current =
        new Date(date);

    current.setHours(0,0,0,0);

    const diff =
        current - start;

    return Math.max(
        1,
        Math.floor(
            diff / 86400000 / 7
        ) + 1
    );
}


/* =========================================================
   WEEK RANGE
========================================================= */

function parseWeekRange(value) {

    if (!value)
        return null;

    const match =
        String(value).match(
            /(\d+)\s*[–—-]\s*(\d+)/
        );

    if (!match)
        return null;

    return {
        from: Number(match[1]),
        to: Number(match[2])
    };
}


/* =========================================================
   REAL LESSON
========================================================= */

function isRealLesson(lesson) {

    if (!lesson)
        return false;

    const name =
        String(
            lesson[2] || ""
        ).trim();

    if (!name)
        return false;

    if (
        name.toLowerCase() ===
        "заняття"
    )
        return false;

    return true;
}


/* =========================================================
   WEEK FILTER
========================================================= */

function isLessonForWeek(
    lesson,
    week
) {

    if (!isRealLesson(lesson))
        return false;

    const range =
        parseWeekRange(
            lesson[5]
        );

    if (!range)
        return true;

    return (
        week >= range.from &&
        week <= range.to
    );
}


/* =========================================================
   GET LESSONS
========================================================= */

function getVisibleLessons(
    day,
    week
) {

    return (
        schedule[day] || []
    ).filter(
        lesson =>
            isLessonForWeek(
                lesson,
                week
            )
    );
}


/* =========================================================
   MINUTES
========================================================= */

function minutes(time) {

    const [
        h,
        m
    ] =
        time
        .split(":")
        .map(Number);

    return h * 60 + m;
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(
        text || ""
    ).replace(
        /[&<>"']/g,
        char => ({

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        })[char]
    );
}


/* =========================================================
   SAFE URL
========================================================= */

function safeURL(url) {

    if (!url)
        return "";

    const value =
        String(url).trim();

    if (
        value.startsWith("https://") ||
        value.startsWith("http://")
    ) {
        return value;
    }

    return "";
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const now =
        new Date();

    const today =
        jsDays[
            now.getDay()
        ];

    const week =
        getAcademicWeek(now);

    document.getElementById(
        "weekBadge"
    ).textContent =
        `${week} тиждень`;

    document.getElementById(
        "footerWeek"
    ).textContent =
        `${week} тиждень`;

    const container =
        document.getElementById(
            "schedule"
        );

    container.innerHTML = "";

    days.forEach(day => {

        if (
            selectedDay !== "all" &&
            selectedDay !== day
        )
            return;

        let lessons =
            getVisibleLessons(
                day,
                week
            );

        if (searchText) {

            lessons =
                lessons.filter(
                    lesson => {

                        const text =
                            lesson
                            .join(" ")
                            .toLowerCase();

                        return text.includes(
                            searchText
                        );

                    }
                );
        }

        const dayElement =
            document.createElement(
                "div"
            );

        dayElement.className = "day";

        if (day === today) {

            dayElement.classList.add(
                "today"
            );

        }

        dayElement.innerHTML = `

            <div class="dayHeader">

                <div class="dayName">
                    ${day}
                </div>

                ${
                    day === today
                    ?
                    `
                    <div class="todayMark">
                        ● СЬОГОДНІ
                    </div>
                    `
                    :
                    ""
                }

            </div>

            <div class="lessons">

                ${
                    lessons.length
                    ?

                    lessons
                    .map(
                        lesson =>
                            createLessonHTML(
                                lesson,
                                day,
                                now
                            )
                    )
                    .join("")

                    :

                    `
                    <div class="empty">
                        На цьому тижні
                        пар немає
                    </div>
                    `
                }

            </div>
        `;

        container.appendChild(
            dayElement
        );

    });

    updateHero(now);
    updateProgresses(now);
}


/* =========================================================
   LESSON HTML
========================================================= */

function createLessonHTML(
    lesson,
    day,
    now
) {

    const [
        start,
        end,
        name,
        teacher,
        room,
        range,
        link
    ] = lesson;

    const today =
        jsDays[
            now.getDay()
        ];

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    let state = "";
    let status = "";

    if (day === today) {

        const startM =
            minutes(start);

        const endM =
            minutes(end);

        if (
            currentMinutes >= startM &&
            currentMinutes < endM
        ) {

            state = "current";
            status = "● ЗАРАЗ";

        }
        else if (
            currentMinutes < startM
        ) {

            state = "next";
            status = "◉ НАСТУПНА";

        }
        else {

            state = "past";

        }
    }

    const validLink =
        safeURL(link);

    return `

        <div
            class="lesson ${state}"
            data-start="${escapeHTML(start)}"
            data-end="${escapeHTML(end)}"
            data-day="${escapeHTML(day)}"
        >

            <div class="lessonTime">
                ${escapeHTML(start)} — ${escapeHTML(end)}
            </div>

            <div class="lessonName">
                ${escapeHTML(name)}
            </div>

            ${
                teacher
                ?
                `
                <div class="lessonInfo">
                    👨‍🏫
                    ${escapeHTML(teacher)}
                </div>
                `
                :
                ""
            }

            ${
                room
                ?
                `
                <div class="lessonInfo">
                    📍
                    ${escapeHTML(room)}
                </div>
                `
                :
                ""
            }

            ${
                range
                ?
                `
                <div class="lessonBadge">
                    Тижні ${escapeHTML(range)}
                </div>
                `
                :
                `
                <div class="lessonBadge">
                    Тижні 1-8
                </div>
                `
            }

            ${
                validLink
                ?
                `
                <a
                    class="lessonLink"
                    href="${escapeHTML(validLink)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🔗 Перейти на пару
                </a>
                `
                :
                ""
            }

            ${
                status
                ?
                `
                <div class="lessonStatus">
                    ${status}
                </div>
                `
                :
                ""
            }

        </div>

    `;
}


/* =========================================================
   HERO
========================================================= */

function updateHero(now) {

    const day =
        jsDays[
            now.getDay()
        ];

    const week =
        getAcademicWeek(now);

    document.getElementById(
        "heroTitle"
    ).textContent =

        day === "Субота" ||
        day === "Неділя"

        ?

        "Вихідний день"

        :

        day;

    const lessons =
        days.includes(day)

        ?

        getVisibleLessons(
            day,
            week
        )

        :

        [];

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    let current = null;
    let next = null;

    lessons.forEach(lesson => {

        const start =
            minutes(
                lesson[0]
            );

        const end =
            minutes(
                lesson[1]
            );

        if (
            currentMinutes >= start &&
            currentMinutes < end
        ) {

            current = lesson;

        }

        if (
            currentMinutes < start &&
            !next
        ) {

            next = lesson;

        }

    });

    document.getElementById(
        "currentLesson"
    ).textContent =

        current
        ?
        current[2]
        :
        "—";

    document.getElementById(
        "nextLesson"
    ).textContent =

        next
        ?
        `${next[2]} · ${next[0]}`
        :
        "—";
}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    minutesLeft
) {

    if (minutesLeft < 0)
        minutesLeft = 0;

    const h =
        Math.floor(
            minutesLeft / 60
        );

    const m =
        Math.floor(
            minutesLeft % 60
        );

    if (h > 0) {
        return `${h} год ${m} хв`;
    }

    return `${m} хв`;
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgresses(now) {

    const day =
        jsDays[
            now.getDay()
        ];

    const week =
        getAcademicWeek(now);

    const lessons =
        days.includes(day)

        ?

        getVisibleLessons(
            day,
            week
        )

        :

        [];

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    let currentLesson = null;
    let nextLesson = null;

    lessons.forEach(lesson => {

        const start =
            minutes(
                lesson[0]
            );

        const end =
            minutes(
                lesson[1]
            );

        if (
            currentMinutes >= start &&
            currentMinutes < end
        ) {

            currentLesson =
                lesson;

        }

        if (
            currentMinutes < start &&
            !nextLesson
        ) {

            nextLesson =
                lesson;

        }

    });

    updateLessonProgress(
        currentLesson,
        currentMinutes
    );

    updateDayProgress(
        lessons,
        currentMinutes,
        currentLesson,
        nextLesson
    );
}


/* =========================================================
   LESSON PROGRESS
========================================================= */

function updateLessonProgress(
    lesson,
    currentMinutes
) {

    const bar =
        document.getElementById(
            "lessonProgressBar"
        );

    const percent =
        document.getElementById(
            "lessonProgressPercent"
        );

    const text =
        document.getElementById(
            "lessonProgressText"
        );

    const startElement =
        document.getElementById(
            "lessonProgressStart"
        );

    const remainingElement =
        document.getElementById(
            "lessonProgressRemaining"
        );

    const endElement =
        document.getElementById(
            "lessonProgressEnd"
        );

    if (!lesson) {

        bar.style.width = "0%";

        percent.textContent = "0%";

        text.textContent =
            "Немає активної пари";

        startElement.textContent =
            "--:--";

        remainingElement.textContent =
            "--";

        endElement.textContent =
            "--:--";

        return;
    }

    const start =
        minutes(
            lesson[0]
        );

    const end =
        minutes(
            lesson[1]
        );

    const total =
        end - start;

    const passed =
        currentMinutes - start;

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                passed / total * 100
            )
        );

    bar.style.width =
        progress + "%";

    percent.textContent =
        Math.round(progress) + "%";

    text.textContent =
        lesson[2];

    startElement.textContent =
        lesson[0];

    endElement.textContent =
        lesson[1];

    remainingElement.textContent =
        "залишилось " +
        formatDuration(
            end - currentMinutes
        );
}


/* =========================================================
   DAY PROGRESS
========================================================= */

function updateDayProgress(
    lessons,
    currentMinutes,
    currentLesson,
    nextLesson
) {

    const bar =
        document.getElementById(
            "dayProgressBar"
        );

    const percent =
        document.getElementById(
            "dayProgressPercent"
        );

    const text =
        document.getElementById(
            "dayProgressText"
        );

    const startElement =
        document.getElementById(
            "dayStart"
        );

    const remainingElement =
        document.getElementById(
            "dayRemaining"
        );

    const endElement =
        document.getElementById(
            "dayEnd"
        );

    if (!lessons.length) {

        bar.style.width = "0%";

        percent.textContent = "0%";

        text.textContent =
            "Сьогодні пар немає";

        startElement.textContent =
            "--:--";

        remainingElement.textContent =
            "--";

        endElement.textContent =
            "--:--";

        return;
    }

    const firstStart =
        minutes(
            lessons[0][0]
        );

    const lastEnd =
        minutes(
            lessons[
                lessons.length - 1
            ][1]
        );

    const total =
        lastEnd - firstStart;

    let currentPoint =
        currentMinutes;

    if (
        currentPoint <
        firstStart
    ) {

        currentPoint =
            firstStart;
    }

    if (
        currentPoint >
        lastEnd
    ) {

        currentPoint =
            lastEnd;
    }

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                (
                    currentPoint -
                    firstStart
                ) /
                total *
                100
            )
        );

    bar.style.width =
        progress + "%";

    percent.textContent =
        Math.round(progress) + "%";

    text.textContent =

        currentLesson
        ?

        `Зараз: ${currentLesson[2]}`

        :

        nextLesson
        ?

        `Далі: ${nextLesson[2]}`

        :

        "Навчальний день завершено";

    startElement.textContent =
        lessons[0][0];

    endElement.textContent =
        lessons[
            lessons.length - 1
        ][1];

    if (
        currentMinutes <
        firstStart
    ) {

        remainingElement.textContent =
            "до початку " +
            formatDuration(
                firstStart -
                currentMinutes
            );

    }
    else if (
        currentMinutes <
        lastEnd
    ) {

        remainingElement.textContent =
            "до кінця " +
            formatDuration(
                lastEnd -
                currentMinutes
            );

    }
    else {

        remainingElement.textContent =
            "завершено";

    }
}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "uk-UA",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    document.getElementById(
        "clock"
    ).textContent =
        time;

    const minuteKey =
        `${now.getFullYear()}-` +
        `${now.getMonth()}-` +
        `${now.getDate()}-` +
        `${now.getHours()}-` +
        `${now.getMinutes()}`;

    const week =
        getAcademicWeek(now);

    if (
        minuteKey !== lastMinute ||
        week !== lastWeek
    ) {

        lastMinute =
            minuteKey;

        lastWeek =
            week;

        render();

    }
    else {

        updateHero(now);
        updateProgresses(now);

    }
}

    if (

}

    document.body.classList.remove(
        "light",
        "blueTheme",
        "purpleTheme",

    if (theme !== "dark") {

        document.body.classList.add(

        );

    }

    localStorage.setItem(
        "scheduleTheme",
        theme
    );

    themeMenu.classList.remove(
        "open"
    );
}
